<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections Hub - SkillSwap</title>
    <meta name="description" content="Manage your incoming swap requests and interact with accepted partners.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sticky Navigation -->
    <nav class="navbar" id="main-nav"></nav>

    <!-- Connections Management Workspace -->
    <main class="connections-page">
        <!-- Header -->
        <header class="connections-header">
            <h1>Connections Hub</h1>
            <p>Manage your incoming swap requests and launch messages or live sessions with accepted partners.</p>
        </header>

        <!-- Pending Requests Section -->
        <section class="connections-section" aria-label="Pending Requests">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="color:var(--warning);"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Pending Requests
            </h2>
            <div id="connections-container" class="connections-grid">
                <!-- Skeleton cards while loading -->
                <div class="skeleton-card">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div class="skeleton" style="width:44px; height:44px; border-radius:50%;"></div>
                        <div style="flex:1;">
                            <div class="skeleton skeleton-text" style="width:50%; margin-bottom:6px;"></div>
                            <div class="skeleton skeleton-text" style="width:30%;"></div>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:16px;">
                        <div class="skeleton" style="height:38px; flex:1; border-radius:8px;"></div>
                        <div class="skeleton" style="height:38px; flex:1; border-radius:8px;"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Accepted Connections Section -->
        <section class="connections-section" aria-label="Accepted Connections">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="color:var(--success);"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                My Accepted Connections
            </h2>
            <div id="accepted-connections-container" class="connections-grid">
                <!-- Skeleton cards while loading -->
                <div class="skeleton-card">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div class="skeleton" style="width:44px; height:44px; border-radius:50%;"></div>
                        <div style="flex:1;">
                            <div class="skeleton skeleton-text" style="width:50%; margin-bottom:6px;"></div>
                            <div class="skeleton skeleton-text" style="width:30%;"></div>
                        </div>
                    </div>
                    <div class="skeleton skeleton-text" style="width:80%; margin-top:12px;"></div>
                    <div style="display:flex; gap:8px; margin-top:16px;">
                        <div class="skeleton" style="height:38px; flex:1; border-radius:8px;"></div>
                        <div class="skeleton" style="height:38px; flex:1; border-radius:8px;"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Global Application Engine -->
    <script src="script.js"></script>
</body>
</html>
